<!DOCTYPE html>
<html>
<head>
    <title>CreativeLab 🎨</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Welcome to CreativeLab</h1>
        <form method="POST">
            <input type="text" name="user_input" placeholder="Ask me for a story, poem, joke, melody, or art..." required>
            <button type="submit">Generate</button>
        </form>
        <div class="response">
            <h2>Response:</h2>
            <p>{{ response }}</p>
        </div>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
